<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --pink: #ff007a; --bg: #0a0b1e; }
        body { background: var(--bg); color: #e0e0ff; font-family: 'Rajdhani', sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        
        /* UI Header */
        header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--cyan); margin: 0; text-shadow: 0 0 10px var(--cyan); }

        /* Status Banner (Critical for Debugging) */
        #status-bar { font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 5px; text-align: center; color: #aaa; }

        /* Chat Area */
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 0.95rem; }
        .user { align-self: flex-end; background: var(--pink); color: white; }
        .ai { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--cyan); }

        /* Mic Button & Controls */
        .controls { padding: 20px; display: flex; flex-direction: column; align-items: center; background: linear-gradient(transparent, var(--bg)); }
        
        .mic-box { position: relative; margin-bottom: 20px; }
        #mic-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--cyan); background: none; font-size: 30px; color: var(--cyan); cursor: pointer; transition: 0.3s; z-index: 10; position: relative; }
        
        /* Listening Animation */
        .listening #mic-btn { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 20px var(--pink); }
        .ripple { position: absolute; top: 0; left: 0; width: 70px; height: 70px; border: 2px solid var(--cyan); border-radius: 50%; opacity: 0; pointer-events: none; }
        .listening .ripple { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2); opacity: 0; } }

        /* Text Input Fallback */
        .text-box { width: 100%; max-width: 400px; display: flex; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 5px 15px; border: 1px solid rgba(0,242,255,0.2); }
        input { flex: 1; background: none; border: none; color: white; padding: 10px; outline: none; }
        #send-btn { background: none; border: none; color: var(--cyan); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header><h1>OMNIX</h1></header>
    <div id="status-bar">Checking system status...</div>

    <main id="chat">
        <div class="msg ai">Omnix online. Tap the mic to begin.</div>
    </main>

    <div class="controls">
        <div class="mic-box" id="mic-container">
            <button id="mic-btn">🎙️</button>
            <div class="ripple"></div>
        </div>

        <div class="text-box">
            <input type="text" id="text-input" placeholder="Type command...">
            <button id="send-btn">SEND</button>
        </div>
    </div>

<script>
    const chat = document.getElementById('chat');
    const micBtn = document.getElementById('mic-btn');
    const status = document.getElementById('status-bar');
    const textInput = document.getElementById('text-input');

    // 1. Check for Secure Context (HTTPS)
    if (window.location.protocol === 'file:') {
        status.innerHTML = "⚠️ ERROR: Mic won't work on local files. Use a local server or HTTPS.";
        status.style.color = "orange";
    }

    // 2. Initialize Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = () => {
            document.getElementById('mic-container').classList.add('listening');
            status.innerText = "Listening...";
        };

        recognition.onerror = (event) => {
            status.innerText = "Error: " + event.error;
            console.error("Speech Error:", event.error);
            document.getElementById('mic-container').classList.remove('listening');
        };

        recognition.onend = () => {
            document.getElementById('mic-container').classList.remove('listening');
            status.innerText = "Ready.";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            handleInput(text);
        };
    } else {
        status.innerText = "Critical: Browser doesn't support Voice API.";
    }

    // 3. User Input Logic
    function handleInput(text) {
        if (!text) return;
        addMsg(text, 'user');
        
        // Mock AI thinking
        const aiMsg = addMsg("...", 'ai');
        setTimeout(() => {
            const reply = getResponse(text);
            aiMsg.innerText = reply;
            speak(reply);
        }, 600);
    }

    function getResponse(input) {
        input = input.toLowerCase();
        if (input.includes("time")) return "The current time is " + new Date().toLocaleTimeString();
        if (input.includes("hello")) return "Hello user. System OMNIX is ready.";
        return "You said: " + input;
    }

    function addMsg(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = 1.2;
        utter.rate = 1.0;
        synth.speak(utter);
    }

    // 4. Permission & Mic Trigger
    micBtn.addEventListener('click', async () => {
        // Request Permission explicitly
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            recognition.start();
        } catch (err) {
            status.innerText = "Mic access denied.";
            alert("Please enable microphone permissions in your browser settings.");
        }
    });

    document.getElementById('send-btn').addEventListener('click', () => {
        handleInput(textInput.value);
        textInput.value = '';
    });
</script>
</body>
</html>
