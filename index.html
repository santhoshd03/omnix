<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OMNIX AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --cyan: #00f2ff;
            --pink: #ff007a;
            --bg: #070817;
            --panel: rgba(255,255,255,0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #10194a, var(--bg) 55%);
            color: #e9faff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.25);
        }

        h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            color: var(--cyan);
            letter-spacing: 4px;
            text-shadow:
                0 0 8px var(--cyan),
                0 0 20px var(--cyan);
        }

        #status-bar {
            text-align: center;
            padding: 7px;
            font-size: 0.8rem;
            color: #aaa;
            background: rgba(0,0,0,0.4);
            min-height: 30px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff007a, #c600ff);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 0 12px rgba(255,0,122,0.25);
        }

        .ai {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid rgba(0,242,255,0.55);
            color: #eaffff;
            border-bottom-left-radius: 4px;
            box-shadow: 0 0 12px rgba(0,242,255,0.08);
        }

        .controls {
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background:
                linear-gradient(
                    transparent,
                    rgba(7,8,23,0.98) 30%
                );
        }

        .mic-box {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 18px;
        }

        #mic-btn {
            width: 70px;
            height: 70px;
            margin: 5px;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            background: rgba(0,242,255,0.04);
            color: var(--cyan);
            font-size: 29px;
            cursor: pointer;
            position: relative;
            z-index: 5;
            transition: 0.25s;
            box-shadow: 0 0 12px rgba(0,242,255,0.2);
        }

        #mic-btn:active {
            transform: scale(0.92);
        }

        .listening #mic-btn {
            border-color: var(--pink);
            color: var(--pink);
            box-shadow:
                0 0 15px var(--pink),
                0 0 35px rgba(255,0,122,0.5);
        }

        .ripple {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 70px;
            height: 70px;
            border: 2px solid var(--cyan);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .listening .ripple {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .text-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            padding: 5px 7px 5px 15px;
            border-radius: 25px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(0,242,255,0.3);
        }

        #text-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 11px;
            font-family: inherit;
            font-size: 1rem;
        }

        #text-input::placeholder {
            color: #777;
        }

        #send-btn {
            border: none;
            border-radius: 20px;
            padding: 0 16px;
            background: transparent;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.95);
        }

    </style>
</head>

<body>

    <header>
        <h1>OMNIX</h1>
    </header>

    <div id="status-bar">
        Initializing Omnix...
    </div>

    <main id="chat">

        <div class="msg ai">
            Omnix online. Tap the microphone and speak.
        </div>

    </main>

    <div class="controls">

        <div class="mic-box" id="mic-container">

            <button id="mic-btn" type="button">
                🎙️
            </button>

            <div class="ripple"></div>

        </div>

        <div class="text-box">

            <input
                type="text"
                id="text-input"
                placeholder="Ask Omnix anything..."
                autocomplete="off"
            >

            <button id="send-btn" type="button">
                SEND
            </button>

        </div>

    </div>


<script>

    /* =========================================
       OMNIX ELEMENTS
    ========================================= */

    const chat =
        document.getElementById("chat");

    const micBtn =
        document.getElementById("mic-btn");

    const micContainer =
        document.getElementById("mic-container");

    const status =
        document.getElementById("status-bar");

    const textInput =
        document.getElementById("text-input");

    const sendBtn =
        document.getElementById("send-btn");


    /* =========================================
       SPEECH RECOGNITION
    ========================================= */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;


    if (!SpeechRecognition) {

        status.innerText =
            "❌ Voice recognition is not supported.";

    } else {

        recognition =
            new SpeechRecognition();

        recognition.lang = "en-US";

        recognition.continuous = false;

        recognition.interimResults = false;

        recognition.maxAlternatives = 1;


        recognition.onstart = function () {

            isListening = true;

            micContainer.classList.add("listening");

            status.innerText =
                "🎧 Listening... Speak now";

        };


        recognition.onresult = function (event) {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();

            console.log(
                "Omnix recognized:",
                text
            );

            if (text) {

                status.innerText =
                    "✅ Heard: " + text;

                handleInput(text);

            } else {

                status.innerText =
                    "⚠️ I didn't hear anything.";

            }

        };


        recognition.onerror = function (event) {

            console.error(
                "Speech error:",
                event.error
            );

            isListening = false;

            micContainer.classList.remove(
                "listening"
            );


            if (event.error === "no-speech") {

                status.innerText =
                    "⚠️ No speech detected. Try again.";

            }

            else if (
                event.error === "not-allowed"
            ) {

                status.innerText =
                    "❌ Microphone permission denied.";

            }

            else if (
                event.error === "network"
            ) {

                status.innerText =
                    "❌ Speech service/network error.";

            }

            else {

                status.innerText =
                    "❌ Voice error: " +
                    event.error;

            }

        };


        recognition.onend = function () {

            isListening = false;

            micContainer.classList.remove(
                "listening"
            );

            if (
                status.innerText ===
                "🎧 Listening... Speak now"
            ) {

                status.innerText =
                    "Ready.";

            }

        };

    }


    /* =========================================
       MICROPHONE BUTTON
    ========================================= */

    micBtn.addEventListener(
        "click",
        function () {

            if (!recognition) {

                status.innerText =
                    "❌ Voice recognition unavailable.";

                return;
            }


            if (isListening) {

                recognition.stop();

                return;
            }


            try {

                status.innerText =
                    "Starting microphone...";

                recognition.start();

            }

            catch (error) {

                console.error(error);

                status.innerText =
                    "⚠️ Could not start listening.";

            }

        }
    );


    /* =========================================
       SEND TEXT
    ========================================= */

    sendBtn.addEventListener(
        "click",
        function () {

            const text =
                textInput.value.trim();

            if (!text) return;

            handleInput(text);

            textInput.value = "";

        }
    );


    /* =========================================
       ENTER KEY
    ========================================= */

    textInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                const text =
                    textInput.value.trim();

                if (!text) return;

                handleInput(text);

                textInput.value = "";

            }

        }
    );


    /* =========================================
       SEND MESSAGE TO CLOUDFLARE BACKEND
    ========================================= */

    async function handleInput(text) {

        if (!text || !text.trim()) {
            return;
        }

        text = text.trim();


        /* Show user message */

        addMsg(text, "user");


        /* Show thinking */

        const aiMsg =
            addMsg(
                "🤔 Thinking...",
                "ai"
            );


        status.innerText =
            "☁️ Connecting to Omnix AI...";


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Backend error"
                );

            }


            const reply =
                data.reply;


            if (!reply) {

                throw new Error(
                    "No AI response received."
                );

            }


            /* Display AI answer */

            aiMsg.innerText =
                reply;


            status.innerText =
                "✅ Omnix ready";


            /* Speak AI answer */

            speak(reply);

        }

        catch (error) {

            console.error(
                "Omnix AI error:",
                error
            );


            aiMsg.innerText =
                "Sorry, I couldn't connect to my AI brain.";


            status.innerText =
                "❌ AI connection error";

        }

    }


    /* =========================================
       ADD MESSAGE TO CHAT
    ========================================= */

    function addMsg(
        text,
        sender
    ) {

        const div =
            document.createElement("div");

        div.className =
            "msg " + sender;

        div.innerText =
            text;

        chat.appendChild(div);

        chat.scrollTop =
            chat.scrollHeight;

        return div;

    }


    /* =========================================
       TEXT TO SPEECH
    ========================================= */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            return;
        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            "en-US";

        utterance.pitch =
            1.05;

        utterance.rate =
            1.0;

        utterance.volume =
            1.0;


        window.speechSynthesis.speak(
            utterance
        );

    }


    /* =========================================
       INITIAL STATUS
    ========================================= */

    if (SpeechRecognition) {

        status.innerText =
            "✅ Omnix ready. Tap 🎙️ and speak.";

    } else {

        status.innerText =
            "⚠️ Type your question below.";

    }

</script>

</body>
</html>
